name: Dependency audit
on:
  push:
    branches: [main]
    paths: [pnpm-lock.yaml, apps/api/uv.lock, .github/workflows/dependencies.yml]
  pull_request:
    paths: [pnpm-lock.yaml, apps/api/uv.lock, .github/workflows/dependencies.yml]
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: "10.28.2"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.13.6"
      - run: pnpm install --frozen-lockfile
      - name: Audit production JavaScript dependencies
        run: pnpm audit --prod --audit-level high
      - name: Export locked Python runtime dependencies
        run: uv export --project apps/api --frozen --no-dev --no-emit-project --no-hashes -o /tmp/deepstack-requirements.txt
      - name: Audit production Python dependencies
        run: uvx pip-audit -r /tmp/deepstack-requirements.txt --no-deps --disable-pip
