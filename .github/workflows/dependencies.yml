name: Dependency audit
on:
  push:
    branches: [main]
    paths: [pnpm-lock.yaml, apps/api/uv.lock, .github/workflows/dependencies.yml]
  pull_request:
    paths: [pnpm-lock.yaml, apps/api/uv.lock, .github/workflows/dependencies.yml]
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: "10.28.2"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
      - run: pnpm install --frozen-lockfile
      - name: Audit production JavaScript dependencies
        run: pnpm audit --prod --audit-level high
      - name: Export locked Python runtime dependencies
        run: uv export --project apps/api --frozen --no-dev --no-emit-project --no-hashes -o /tmp/deepstack-requirements.txt
      - name: Audit production Python dependencies
        run: uvx pip-audit -r /tmp/deepstack-requirements.txt --no-deps --disable-pip
