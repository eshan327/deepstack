name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DATABASE_URL: postgresql+psycopg://deepstack:deepstack@127.0.0.1:5432/deepstack
  DATABASE_URL_UNPOOLED: postgresql+psycopg://deepstack:deepstack@127.0.0.1:5432/deepstack
  POKER_API_ORIGIN: http://127.0.0.1:8000

jobs:
  backend:
    name: Rules, accounts, review, and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: deepstack
          POSTGRES_PASSWORD: deepstack
          POSTGRES_DB: deepstack
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U deepstack" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --project apps/api --frozen --python 3.12
      - name: Check dependency compatibility
        run: uv pip check --python apps/api/.venv/bin/python
      - name: Migrate, lint, and test
        working-directory: apps/api
        run: |
          uv run alembic upgrade head
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -q --junitxml=/tmp/backend-tests.xml
      - name: Seeded poker integrity simulation
        working-directory: apps/api
        run: uv run python simulate.py --hands 120 --seed 20261029 --samples 64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: backend-failure
          path: /tmp/backend-tests.xml
          retention-days: 7

  web:
    name: API contract, frontend, and real browser flows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: deepstack
          POSTGRES_PASSWORD: deepstack
          POSTGRES_DB: deepstack
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U deepstack" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: "10.28.2"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project apps/api --frozen --python 3.12
      - name: Check generated API contract
        run: pnpm api:types && git diff --exit-code apps/api/openapi.json apps/web/lib/api.generated.ts
      - name: Pacing tests and frontend checks
        run: |
          pnpm test:unit
          pnpm typecheck
          pnpm lint
          pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run full browser flows
        run: |
          uv run --project apps/api alembic -c apps/api/alembic.ini upgrade head
          uv run --project apps/api uvicorn main:app --app-dir apps/api --host 127.0.0.1 --port 8000 > /tmp/deepstack-api.log 2>&1 &
          pnpm --filter web start > /tmp/deepstack-web.log 2>&1 &
          trap 'kill $(jobs -pr) 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health >/dev/null && curl -fsS http://127.0.0.1:3000 >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/v1/health >/dev/null
          curl -fsS http://127.0.0.1:3000 >/dev/null
          pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-failure
          path: |
            /tmp/deepstack-playwright
            /tmp/deepstack-qa
            /tmp/deepstack-api.log
            /tmp/deepstack-web.log
          retention-days: 7
