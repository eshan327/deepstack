[project]
name = "deepstack-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.162.2,<1",
  "uvicorn>=0.34,<1",
  "pokerkit==0.7.7",
  "sqlalchemy>=2.1.8,<2.2",
  "psycopg[binary]>=3.3.8,<4",
  "alembic>=1.15,<2",
  "python-dotenv>=1,<2",
  "PyJWT[crypto]>=2.10,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.17.4,<1"]

[tool.vercel]
entrypoint = "main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
